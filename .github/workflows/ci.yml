name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        shell: bash
        run: |
          set +e
          mypy --show-error-codes 2>&1 | tee mypy-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-python-${{ matrix.python-version }}
          path: mypy-output.txt
          if-no-files-found: warn
      - name: Test
        run: pytest --cov=industrial_ai_toolkit --cov-report=term-missing
