[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "industrial-ai-toolkit"
version = "0.1.0"
description = "Open-source building blocks for trustworthy Industrial AI and manufacturing analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yacine Ibrir" }]
keywords = ["industrial-ai", "manufacturing", "mes", "oee", "opc-ua", "modbus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
industrial-ai = "industrial_ai_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/yacine-ibr/industrial-ai-toolkit"
Issues = "https://github.com/yacine-ibr/industrial-ai-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_ai_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["industrial_ai_toolkit"]
